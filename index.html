// ── Firebase config (kirana-35ec6) ──
const cfg={apiKey:"AIzaSyCY-rawh0uXeikfUK7b50FO8BxnhvMzGaM",authDomain:"kirana-35ec6.firebaseapp.com",projectId:"kirana-35ec6",storageBucket:"kirana-35ec6.firebasestorage.app",messagingSenderId:"782675388251",appId:"1:782675388251:web:d8636603092c399be75c7e"};

const num=v=>parseFloat(v)||0,rs=v=>'₹'+(Math.round(v*100)/100);
let lang=localStorage.lang||'mr';
const D={login:['लॉगिन','Login'],email:['ईमेल','Email'],pw:['पासवर्ड','Password'],bill:['बिल','Bill'],items:['माल','Items'],udhaar:['उधार','Udhaar'],rep:['रिपोर्ट','Reports'],set:['सेटिंग','Settings'],stores:['दुकाने','Stores'],
scan:['बारकोड स्कॅन / नाव शोधा','Scan barcode / search item'],cust:['ग्राहकाचे नाव','Customer name'],phone:['फोन','Phone'],addr:['पत्ता','Address'],charge:['जादा खर्च','Extra charge'],label:['तपशील (पॅकिंग इ.)','Label (packing etc.)'],amt:['रक्कम','Amount'],add:['जोडा','Add'],total:['एकूण','Total'],paid:['मिळाले','Paid'],due:['उधार','Due'],save:['बिल जतन करा','Save bill'],print:['प्रिंट','Print'],close:['बंद','Close'],
name:['नाव','Name'],unit:['एकक (kg/नग)','Unit (kg/pcs)'],price:['विक्री किंमत','Sell price'],cost:['खरेदी किंमत','Cost'],stock:['साठा','Stock'],min:['किमान साठा','Min stock'],pos:['क्रम','Pos'],barcode:['बारकोड/SKU','Barcode/SKU'],low:['साठा कमी:','Low stock:'],
queued:['जतन केले — नेट आल्यावर sync होईल','Saved — will sync when online'],ok:['✅ झाले','✅ Done'],search:['नाव/फोन शोधा','Search name/phone'],recv:['पैसे मिळाले','Receive payment'],over:['३० दिवसांहून जुना उधार','Due older than 30 days'],limit:['उधार मर्यादा ओलांडली','Credit limit exceeded'],
shop:['दुकान','Shop'],staff:['शिपाई जोडा','Add shopkeeper'],logout:['बाहेर पडा','Logout'],from:['पासून','From'],to:['पर्यंत','To'],csv:['CSV डाउनलोड','Download CSV'],sales:['विक्री','Sales'],bills:['बिले','Bills'],tname:['दुकानाचे नाव','Store name'],oname:['मालकाचे नाव','Owner name'],logo:['लोगो','Logo'],newst:['नवीन दुकान (टेनंट)','New store (tenant)'],upd:['नवीन आवृत्ती उपलब्ध — अपडेट करा','New version — please update'],reload:['रीलोड','Reload'],off:['हे दुकान बंद आहे','This store is disabled'],edit:['बदला','Edit'],addstock:['साठा जोडा','Add stock'],credit:['उधार मर्यादा ₹','Credit limit ₹'],minv:['किमान आवृत्ती','Min version']};
const t=k=>(D[k]||[k,k])[lang=='mr'?0:1];
Object.assign(D,{dash:['डॅशबोर्ड','Dashboard'],tsale:['एकूण विक्री','Total sale'],today:['आजची विक्री','Today\'s sale'],outs:['थकबाकी','Outstanding'],top:['टॉप माल (विक्री)','Top items'],week:['गेले ७ दिवस','Last 7 days'],other:['इतर','Other'],ws:['दुकान उघडा','Open workspace'],seed:['डेमो डेटा भरा','Seed demo'],unseed:['डेमो काढा','Remove demo'],tmpl:['टेम्पलेट','Template'],upl:['एक्सेल अपलोड','Upload Excel'],crl:['उधार मर्यादा ₹ (यापेक्षा जास्त उधार झाल्यास इशारा)','Udhaar limit ₹ (warn if a customer owes more)'],users:['वापरकर्ते','Users'],actv:['सक्रिय','Active']});
const S={u:null,un2:[],back:null,users:[],tid:null,ten:null,prods:[],custs:[],bills:[],cart:[],chg:[],tab:'bill',un:[],cust:{name:'',phone:'',addr:''},paid:null,tenants:[],from:'',to:''};
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3200)};
const withTimeout=(p,ms=8000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
// Firestore writes queue offline and only resolve on server ack → never hang the UI.
async function W(p){if(!navigator.onLine){p.catch(()=>{});toast(t('queued'));return}try{await withTimeout(p,8000);toast(t('ok'))}catch(e){if(e.message=='timeout'){toast(t('queued'));return}throw e}}
const busy={};async function once(k,f){if(busy[k])return;busy[k]=1;try{return await f()}catch(e){toast('⚠ '+e.message)}finally{busy[k]=0}}
const tc=n=>collection(db,'tenants',S.tid,n),td=(n,i)=>doc(db,'tenants',S.tid,n,i);
const dev=(localStorage.dev=localStorage.dev||Math.random().toString(36).slice(2,6).toUpperCase());
function invNo(){const d=new Date(),n=(+localStorage.seq||0)+1;localStorage.seq=n;return`${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${dev}-${n}`}
window.addEventListener('error',e=>toast('⚠ '+e.message));

// ── AUTH (never sign out on network failure) ──
onAuthStateChanged(auth,async u=>{
  stop();if(!u){S.u=null;return loginView()}
  let p=null;
  try{const s=await withTimeout(getDoc(doc(db,'users',u.uid)),9000);if(!s.exists()){toast('Profile not found');await signOut(auth);return}p=s.data();localStorage['p_'+u.uid]=JSON.stringify(p)}
  catch(e){const c=localStorage['p_'+u.uid];if(c)p=JSON.parse(c);else return loginView('Internet needed for first login / पहिल्या लॉगिनसाठी नेट हवे')}
  S.u={uid:u.uid,...p};S.tid=p.tenantId||null;start()});
function stop(){S.un.forEach(f=>f());S.un=[];stopT()}
function stopT(){S.un2.forEach(f=>f());S.un2=[];S.prods=[];S.custs=[];S.bills=[]}
window.openWs=id=>{S.back=S.u;S.u={...S.u,role:'owner',tenantId:id,name:'Admin'};S.tid=id;S.ten=null;S.tab='dash';subT();paint()};
window.closeWs=()=>{stopT();S.u=S.back;S.back=null;S.tid=null;S.ten=null;S.tab='tenants';paint()};
function start(){
  const u=S.u;S.tab=u.role=='super'?'tenants':u.role=='owner'?'dash':'bill';
  S.un.push(onSnapshot(doc(db,'settings','appConfig'),s=>{const m=s.data()?.minVersion||0;if(!s.metadata.fromCache&&navigator.onLine&&m>APP_VERSION)verGate()},()=>{}));

  subT()}

  S.un2.push(onSnapshot(doc(db,'tenants',S.tid),s=>{S.ten={id:s.id,...s.data()};paint()}));

  S.un2.push(onSnapshot(tc('customers'),s=>{S.custs=s.docs.map(d=>({id:d.id,...d.data()}));paint(1)}));
  const bq=u.role=='owner'?query(tc('bills'),orderBy('ts','desc'),limit(400)):query(tc('bills'),where('shopId','==',u.shopId||''),limit(400));
  S.un2.push(onSnapshot(bq,s=>{S.bills=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);paint(1)},e=>toast(e.message)));
}

  $('#lg').onclick=()=>once('lg',async()=>{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pwd').value)})}

// ── SHELL ──
function tabs(){const r=S.u.role;return r=='super'?[['tenants','stores']]:r=='owner'?[['dash','dash'],['bill','bill'],['items','items'],['udhaar','udhaar'],['rep','rep'],['set','set']]:[['bill','bill'],['udhaar','udhaar'],['rep','bills']]}
window.go=k=>{S.tab=k;paint()};
function paint(soft){
  if(!S.u)return;if(S.u.role!='super'&&!S.ten)return;
  if(soft&&document.activeElement?.matches('input,select'))return;document.body.classList.toggle('fx',!soft);
  if(S.ten&&S.ten.active===false&&S.u.role!='super'){$('#app').innerHTML=`<main><div class=card>${t('off')}<br><br><button onclick="out()">${t('logout')}</button></div></main>`;return}

  $('#m').innerHTML=`<div class=card><div class=row><input type=date value="${S.from}" onchange="S2.from=this.value;go('rep')"><input type=date value="${S.to}" onchange="S2.to=this.value;go('rep')"></div><h3>${t('sales')}: ${rs(sum('total'))} · ${L.length} ${t('bills')}</h3><div class=mut>${t('paid')}: ${rs(sum('paid'))} · ${t('due')}: ${rs(sum('due'))}${S.u.role=='owner'?' · ±'+rs(profit):''}</div><br><button class=ghost onclick="csv()">${t('csv')}</button></div><div class=card>${L.map(x=>`<div class=pick onclick="showBill(S2.bills.find(b=>b.id=='${x.id}'))"><span>#${x.no}<br><span class=mut>${esc(x.cust?.name||'')} ${new Date(x.ts).toLocaleTimeString()}</span></span><b>${rs(x.total)}</b></div>`).join('')}</div>`;window._L=L}
window.showBill=showBill;
window.csv=()=>{const r=[['No','Date','Shop','Customer','Phone','Total','Paid','Due']].concat((window._L||[]).map(x=>[x.no,new Date(x.ts).toLocaleString(),x.shopName,x.cust?.name||'',x.cust?.phone||'',x.total,x.paid,x.due]));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}));a.download='bills.csv';a.click()};

// ── SETTINGS (owner): store info, shops, shopkeepers ──
function vSet(){const T=S.ten;$('#m').innerHTML=`<div class=card><input id=sn value="${esc(T.name)}" placeholder="${t('tname')}"><input id=sa value="${esc(T.address||'')}" placeholder="${t('addr')}"><input id=sp value="${esc(T.phone||'')}" placeholder="${t('phone')}"><label class=mut>${t('crl')}</label><input id=sl type=number value="${T.creditLimit||5000}" placeholder="${t('credit')}"><button onclick="saveT()" style="width:100%">${t('save')}</button></div>
  <div class=card><b>${t('staff')}</b><input id=se type=email placeholder="${t('email')}"><input id=sw type=password placeholder="${t('pw')}"><input id=sm placeholder="${t('name')}"><select id=ss>${(T.shops||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button onclick="addStaff()" style="width:100%">${t('add')}</button></div>`}
window.saveT=()=>once('st',()=>W(updateDoc(doc(db,'tenants',S.tid),{name:$('#sn').value,address:$('#sa').value,phone:$('#sp').value,creditLimit:num($('#sl').value)})));
window.addShop=()=>{const n=$('#shn').value.trim();if(n)once('sh',()=>W(updateDoc(doc(db,'tenants',S.tid),{shops:[...(S.ten.shops||[]),{id:'s'+Date.now().toString(36),name:n}]})))};
// Create an auth user WITHOUT signing out the current user (secondary app instance).
async function mkUser(email,pw,prof){const a2=initializeApp(cfg,'x'+Date.now()),au=getAuth(a2);try{const c=await withTimeout(createUserWithEmailAndPassword(au,email,pw),12000);await withTimeout(setDoc(doc(db,'users',c.user.uid),prof),12000)}finally{deleteApp(a2)}}
window.addStaff=()=>once('as2',async()=>{if(!navigator.onLine)return toast('Online needed');await mkUser($('#se').value.trim(),$('#sw').value,{role:'cashier',tenantId:S.tid,shopId:$('#ss').value,name:$('#sm').value});toast(t('ok'))});

// ── SUPER ADMIN: tenants ──
function vTenants(){const act=S.tenants.filter(x=>x.active!==false).length,ow=S.users.filter(u=>u.role=='owner').length;$('#m').innerHTML=`<div class=kpis><div class=kpi><small>${t('stores')}</small><b>${S.tenants.length}</b></div><div class=kpi><small>${t('actv')}</small><b>${act}</b></div><div class=kpi><small>${t('users')}</small><b>${S.users.length}</b><small>${ow} owner · ${S.users.length-ow} staff</small></div></div><div class=card><b>${t('newst')}</b><input id=tn placeholder="${t('tname')}"><input id=on placeholder="${t('oname')}"><input id=oe type=email placeholder="${t('email')}"><input id=op type=password placeholder="${t('pw')} (6+)"><label class=mut>${t('logo')}</label><input id=lf type=file accept="image/*"><button onclick="addTenant()" style="width:100%">${t('add')}</button></div>
  <div class=card><div class=row><input id=mv type=number placeholder="${t('minv')}" value="${S.minV||''}"><button class=s onclick="setMin()">${t('save')}</button></div></div>
  ${S.tenants.map(x=>`<div class=card><div class=row>${x.logo?`<img src="${x.logo}" style="width:36px;height:36px;border-radius:8px;flex:0 0 36px">`:''}<b>${esc(x.name)}</b></div>${['active','stock','udhaar','wa'].map(k=>`<label style="margin-right:12px"><input type=checkbox style="width:auto" ${(k=='active'?x.active!==false:x.features?.[k]!==false)?'checked':''} onchange="tog('${x.id}','${k}',this.checked)"> ${k}</label>`).join('')}<div class=row style="margin-top:12px"><button onclick="openWs('${x.id}')">${t('ws')}</button><button class=ghost onclick="seed('${x.id}')">${t('seed')}</button><button class=ghost onclick="unseed('${x.id}')">${t('unseed')}</button></div></div>`).join('')}`}
const shrink=f=>new Promise(r=>{if(!f)return r('');const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,160/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)});
window.addTenant=()=>once('at',async()=>{if(!navigator.onLine)return toast('Online needed');const n=$('#tn').value.trim();if(!n)return;const logo=await shrink($('#lf').files[0]),id=doc(collection(db,'tenants')).id;
  await mkUser($('#oe').value.trim(),$('#op').value,{role:'owner',tenantId:id,name:$('#on').value});
  await withTimeout(setDoc(doc(db,'tenants',id),{name:n,logo,active:true,features:{stock:true,udhaar:true,wa:true},shops:[{id:'main',name:n}],creditLimit:5000,createdAt:Date.now()}),10000);toast(t('ok'));paint()});
window.tog=(id,k,v)=>once('tg',()=>W(updateDoc(doc(db,'tenants',id),k=='active'?{active:v}:{['features.'+k]:v})));
window.setMin=()=>once('mn',()=>W(setDoc(doc(db,'settings','appConfig'),{minVersion:num($('#mv').value)},{merge:true})));

// ── PWA: real sw.js (blob: URLs are not allowed for service workers) ──
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v='+APP_VERSION).catch(()=>{}));
console.info('Kirana Bill v'+APP_VERSION);
</script><script>
(()=>{const R=document.documentElement;if(localStorage.theme)R.dataset.theme=localStorage.theme;R.lang=localStorage.lang||'mr';
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;navigator.vibrate&&navigator.vibrate(12);
const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height),d=document.createElement('span');d.className='rip';
d.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.append(d);setTimeout(()=>d.remove(),600)})})();
