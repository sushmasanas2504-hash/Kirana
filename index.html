 document.body.append(d);const done=v=>{d.remove();r(v)};d.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>done(null));
 const okb=d.querySelector('[data-ok]');if(okb)okb.onclick=()=>{const v=collect?collect(d):true;if(v!==false&&v!==undefined)done(v)};
 d.addEventListener('pointerdown',e=>{if(e.target===d)done(null)});setup&&setup(d,done);

function acMatches(v){v=String(v||'').trim().toLowerCase();const dg=v.replace(/\D/g,'');
 if(!v)return[...S.custs].sort((a,b)=>(b.lastBill||0)-(a.lastBill||0)).slice(0,6);
 return S.custs.filter(c=>(c.name||'').toLowerCase().includes(v)||(dg.length>=3&&ph10(c.phone).includes(dg))||(c.addr||'').toLowerCase().includes(v)).slice(0,8)}
function bindAc(inputs,box,pick){const show=e=>{const L=acMatches(e.target.value);box.innerHTML=L.map(c=>`<div class=aci data-id="${esc(c.id)}"><b>${esc(c.name)}</b> <span class=mut>${esc(c.phone||'')}</span> ${num(c.due)>0?`<span class=badge>${rs(c.due)}</span>`:''}${c.addr?`<br><span class=mut>📍 ${esc(c.addr)}</span>`:''}</div>`).join('');box.style.display=L.length?'block':'none'};
 inputs.forEach(i=>{i.addEventListener('input',show);i.addEventListener('focus',show);i.addEventListener('blur',()=>setTimeout(()=>box.style.display='none',180))});
 box.addEventListener('pointerdown',e=>{const el=e.target.closest('.aci');if(!el)return;e.preventDefault();const c=S.custs.find(c=>c.id==el.dataset.id);box.style.display='none';c&&pick(c)})}

 const n=String(name||'').trim().toLowerCase();if(n){const c=S.custs.find(c=>!ph10(c.phone)&&(c.name||'').trim().toLowerCase()==n);return c?c.id:'n_'+slug(n)}return''}

function vSet(){const T=S.ten,own=isOwner();
 $('#m').innerHTML=(own?`<div class=card><div class=ch><b>🏪 ${t('storeT')}</b></div><input id=sn value="${esc(T.name)}" placeholder="${t('tname')}"><input id=sa value="${esc(T.address||'')}" placeholder="${t('addr')}"><input id=sp type=tel value="${esc(T.phone||'')}" placeholder="${t('phone')}"><input id=su value="${esc(T.upi||'')}" placeholder="${t('upiId')}"><input id=sg value="${esc(T.gstin||'')}" placeholder="${t('gstin')}"><input id=sft value="${esc(T.footer||'')}" placeholder="${t('footer')}: ${t('thanks')}"><label class=mut>${t('crl')}</label><input id=sl type=number value="${T.creditLimit||5000}"><button onclick="saveT()" class=full style="margin-top:6px">${t('saveB')}</button></div>
 <div class=card><div class=ch><b>🏬 ${t('shops')}</b></div>${(T.shops||[]).map(s=>`<div class=lrow>🏬 <div class=f>${esc(s.name)}</div></div>`).join('')}<div class=row><input id=shn placeholder="${t('addShop')}"><button class=s onclick="addShop()">+</button></div></div>
 <div class=card><div class=ch><b>👥 ${t('staff')}</b></div><div id=stl class=mut>…</div><details><summary style="color:var(--acc);font-weight:700">＋ ${t('addStaff')}</summary><input id=sm placeholder="${t('sname')}"><input id=se type=email placeholder="${t('email')}"><input id=sw type=password placeholder="${t('pw')} (6+)"><select id=ss>${(T.shops||[]).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select><button onclick="addStaff()" class=full>${t('add')}</button></details></div>`:'')+
 `<div class=card><div class=ch><b>📱 ${t('app')}</b></div><div class=row><button class=ghost onclick="setLang()">🌐 मराठी / English</button><button class="ghost" onclick="setTheme()">${dark()?'☀️':'🌙'} ${t('theme')}</button></div><div style="margin-top:10px">${instBtn()}</div>${T.validTill?`<p class=mut style="margin-top:10px">${t('plan')}: <b>${esc(T.plan||'—')}</b> · ${t('validTill')}: <b>${fdate(T.validTill)}</b></p>`:''}<p class=mut style="margin-top:8px">${esc(S.u.email||'')} · ${t('ver')} ${APP_VERSION}</p><button class="red full" style="margin-top:10px" onclick="out()">⎋ ${t('logout')}</button></div>`;
 if(own)loadStaff()}
async function loadStaff(){const e=$('#stl');try{const s=await withTimeout(getDocs(query(collection(db,'users'),where('tenantId','==',S.tid))),9000);const L=s.docs.map(d=>({uid:d.id,...d.data()})).filter(u=>u.role=='cashier');if(!$('#stl'))return;
 e.innerHTML=L.map(u=>`<div class=lrow><div class=f><b>${esc(u.name||'')}</b><div class=mut>${esc(u.email||'')} · ${esc(((S.ten.shops||[]).find(s=>s.id==u.shopId)||{}).name||'')}</div></div><label class=sw><input type=checkbox ${u.active!==false?'checked':''} onchange="staffOn('${jsq(u.uid)}',this.checked)">${t('actv')}</label></div>`).join('')||'—'}catch(x){if($('#stl'))e.textContent=x.code=='permission-denied'?t('rulesOld'):'—'}}
G.staffOn=(uid,v)=>once('so',()=>W(updateDoc(doc(db,'users',uid),{active:v})));
G.saveT=()=>once('st',()=>W(updateDoc(doc(db,'tenants',S.tid),{name:$('#sn').value.trim()||S.ten.name,address:$('#sa').value.trim(),phone:$('#sp').value.trim(),upi:$('#su').value.trim(),gstin:$('#sg').value.trim().toUpperCase(),footer:$('#sft').value.trim(),creditLimit:num($('#sl').value)||5000})));
G.addShop=()=>{const n=$('#shn').value.trim();if(n)once('sh',()=>W(updateDoc(doc(db,'tenants',S.tid),{shops:[...(S.ten.shops||[]),{id:'s'+Date.now().toString(36),name:n}]})))};
// Create an auth user WITHOUT signing out the current user (secondary app, in-memory auth so nothing leaks into storage).
async function mkUser(email,pw,prof){if(!/\S+@\S+\.\S+/.test(email))throw new Error(t('email')+'?');if(String(pw).length<6)throw new Error(t('pw')+' 6+');
 const a2=initializeApp(cfg,'x'+Date.now()),au=initializeAuth(a2,{persistence:inMemoryPersistence});try{const c=await withTimeout(createUserWithEmailAndPassword(au,email,pw),12000);await withTimeout(setDoc(doc(db,'users',c.user.uid),{...prof,email,active:true,createdAt:Date.now()}),12000);await signOut(au).catch(()=>{});return c.user.uid}finally{deleteApp(a2).catch(()=>{})}}
G.addStaff=()=>once('as2',async()=>{if(!navigator.onLine)return toast(t('online'));await mkUser($('#se').value.trim(),$('#sw').value,{role:'cashier',tenantId:S.tid,shopId:$('#ss').value||'main',name:$('#sm').value.trim()});toast(t('ok'));['se','sw','sm'].forEach(i=>$('#'+i).value='');loadStaff()});

// ══════════ SUPER ADMIN ══════════
const tStat=x=>{const s=x.stats||{},td=s.day==today();return{sales:td?num(s.sales):0,bills:td?num(s.bills):0,all:num(s.allSales),last:s.last||0}};
function vSaDash(){const T=S.tenants,act=T.filter(x=>x.active!==false),ow=S.users.filter(u=>u.role=='owner').length,st=S.users.filter(u=>u.role=='cashier').length;
 const ST=T.map(x=>({x,...tStat(x)})),net=ST.reduce((s,a)=>s+a.sales,0),nb=ST.reduce((s,a)=>s+a.bills,0),all=ST.reduce((s,a)=>s+a.all,0);
 const exp=T.filter(x=>{const d=daysLeft(x);return d!==null&&d<=7}),ina=act.filter(x=>{const l=tStat(x).last;return!l||Date.now()-l>7*864e5}),top=ST.filter(a=>a.sales>0).sort((a,b)=>b.sales-a.sales).slice(0,8),mx=Math.max(1,...top.map(a=>a.sales));
 $('#m').innerHTML=`<div class=kpis><div class="kpi hot"><small>${t('netSale')}</small><b>${rs(net)}</b><span class=sub>${nb} ${t('billsN')}</span></div><div class=kpi><small>${t('stores')}</small><b>${act.length}/${T.length}</b><span class=sub>${t('actv')}</span></div><div class=kpi><small>${t('users')}</small><b>${S.users.length}</b><span class=sub>${ow} ${t('owners')} · ${st} ${t('staffN')}</span></div><div class=kpi><small>${t('allSale')}</small><b>${rs(all)}</b></div></div>
 <div class=card><div class=ch><b>🏆 ${t('topSt')}</b></div>${top.map(a=>`<div class=hbar><div class=lb><span>${esc(a.x.name)}</span><b>${rs(a.sales)} · ${a.bills}</b></div><div class=tr><span style="width:${a.sales/mx*100}%"></span></div></div>`).join('')||'<p class=mut>—</p>'}</div>
 <div class=card><div class=ch><b>⚠ ${t('attn')}</b></div>${exp.map(x=>{const d=daysLeft(x);return`<div class=lrow><div class=f><b>${esc(x.name)}</b><div class=mut>${t('validTill')} ${fdate(x.validTill)}</div></div><span class="tag ${d<0?'red':'amb'}">${d<0?t('expd'):d+' '+t('d')}</span><button class="sm ghost s" onclick="editSt('${jsq(x.id)}')">✏️</button></div>`}).join('')}
 ${ina.map(x=>`<div class=lrow><div class=f><b>${esc(x.name)}</b><div class=mut>${t('lastAct')}: ${ago(tStat(x).last)}</div></div><span class="tag">${t('inactive')}</span><button class="sm ghost s" onclick="openWs('${jsq(x.id)}')">${t('ws')}</button></div>`).join('')}${exp.length+ina.length?'':`<p class=mut>${t('noneAttn')}</p>`}</div>
 <button class=full onclick="go('tenants');setTimeout(()=>{const d=document.getElementById('nst');if(d)d.open=true},50)">＋ ${t('newst')}</button>`}
function vTenants(){$('#m').innerHTML=`<details class=card id=nst><summary><b style="color:var(--acc)">＋ ${t('newst')}</b></summary><input id=tn placeholder="${t('tname')}"><div class=row><input id=tcity placeholder="${t('city')}"><input id=tph type=tel placeholder="${t('phone')}"></div><input id=on placeholder="${t('oname')}"><input id=oe type=email placeholder="${t('email')}"><input id=op type=password placeholder="${t('pw')} (6+)"><div class=row><select id=tpl><option>Basic</option><option>Pro</option><option>Trial</option></select><input id=tvt type=date value="${addDays(365)}" title="${t('validTill')}"></div><label class=mut>${t('logo')}</label><input id=lf type=file accept="image/*"><button onclick="addTenant()" class=full>${t('add')}</button></details>
 <div class=chips>${[['all',t('all')],['active',t('actv')],['off',t('disabled')],['exp',t('expiring')]].map(([k,l])=>`<button class="chip s ${S.sf==k?'on':''}" onclick="S2.sf='${k}';vTenants()">${l}</button>`).join('')}</div>
 <input placeholder="🔍 ${t('search')}" value="${esc(S.sq)}" oninput="S2.sq=this.value;tl()"><div id=tl style="margin-top:8px"></div>`;tl()}
G.tl=()=>{const v=S.sq.toLowerCase(),L=S.tenants.filter(x=>((x.name||'').toLowerCase().includes(v)||(x.city||'').toLowerCase().includes(v)||(x.phone||'').includes(v))&&(S.sf=='all'||(S.sf=='active'?x.active!==false:S.sf=='off'?x.active===false:(d=>d!==null&&d<=15)(daysLeft(x))))).sort((a,b)=>tStat(b).sales-tStat(a).sales);
 $('#tl').innerHTML=L.map(x=>{const s=tStat(x),d=daysLeft(x),own=S.users.find(u=>u.role=='owner'&&u.tenantId==x.id),ns=S.users.filter(u=>u.tenantId==x.id).length;return`<div class=card><div class=lrow style="padding-top:0"><img src="${esc(x.logo||'icon-192.png')}"><div class=f><b>${esc(x.name)}</b><div class=mut>${esc([x.city,x.phone].filter(Boolean).join(' · '))}${own?`<br>👤 ${esc(own.name||'')} · ${esc(own.email||'')}`:''}</div></div>${x.active===false?`<span class="tag red">${t('disabled')}</span>`:`<span class="tag grn">${t('actv')}</span>`}</div>
 <div class=mut style="margin:6px 0">${t('tsale')}: <b>${rs(s.sales)}</b> (${s.bills}) · ${t('lastAct')}: ${ago(s.last)} · 👥 ${ns}${x.plan?` · <span class="tag blu">${esc(x.plan)}</span>`:''}${d!==null?`<span class="tag ${d<0?'red':d<=7?'amb':''}">${t('validTill')} ${fdate(x.validTill)}</span>`:''}</div>
 <div>${['active','stock','udhaar','wa'].map(k=>`<label class=sw><input type=checkbox ${(k=='active'?x.active!==false:x.features?.[k]!==false)?'checked':''} onchange="tog('${jsq(x.id)}','${k}',this.checked)">${k=='wa'?'WhatsApp':k=='active'?t('actv'):t(k)}</label>`).join('')}</div>
 <div class="row wrap" style="margin-top:8px"><button class=sm onclick="openWs('${jsq(x.id)}')">${t('ws')} →</button><button class="sm ghost" onclick="editSt('${jsq(x.id)}')">✏️ ${t('edit')}</button><button class="sm ghost" onclick="seed('${jsq(x.id)}')">${t('seed')}</button><button class="sm ghost" onclick="unseed('${jsq(x.id)}')">${t('unseed')}</button></div></div>`}).join('')||'<p class=mut>—</p>'};
const shrink=f=>new Promise(r=>{if(!f)return r('');const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,200/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.onerror=()=>r('');i.src=URL.createObjectURL(f)});
G.addTenant=()=>once('at',async()=>{if(!navigator.onLine)return toast(t('online'));const n=$('#tn').value.trim();if(!n)return toast(t('nameReq'));const logo=await shrink($('#lf').files[0]),id=doc(collection(db,'tenants')).id;
  await mkUser($('#oe').value.trim(),$('#op').value,{role:'owner',tenantId:id,name:$('#on').value.trim()});
  await withTimeout(setDoc(doc(db,'tenants',id),{name:n,city:$('#tcity').value.trim(),phone:$('#tph').value.trim(),logo,active:true,features:{stock:true,udhaar:true,wa:true},shops:[{id:'main',name:n}],creditLimit:5000,plan:$('#tpl').value,validTill:$('#tvt').value||'',createdAt:Date.now()}),10000);toast(t('ok'));vTenants()});
G.editSt=async id=>{const x=S.tenants.find(a=>a.id==id);if(!x)return;
 const v=await modal({title:'✏️ '+t('editSt'),body:`<input data-f=name value="${esc(x.name)}" placeholder="${t('tname')}"><div class=row><input data-f=city value="${esc(x.city||'')}" placeholder="${t('city')}"><input data-f=phone value="${esc(x.phone||'')}" placeholder="${t('phone')}"></div><input data-f=address value="${esc(x.address||'')}" placeholder="${t('addr')}"><label class=mut>${t('plan')} · ${t('validTill')}</label><div class=row><input data-f=plan value="${esc(x.plan||'')}" placeholder="${t('plan')}"><input data-f=validTill type=date value="${esc(x.validTill||'')}"></div><div class="chips">${[30,90,365].map(n=>`<button type=button class="chip s" data-ext=${n}>+${n} ${t('d')}</button>`).join('')}</div><textarea data-f=notes rows=2 placeholder="${t('notes')}">${esc(x.notes||'')}</textarea><label class=mut>${t('logo')}</label><input data-f=logo type=file accept="image/*">`,
  setup:d=>d.querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>{const i=d.querySelector('[data-f=validTill]'),base=i.value&&i.value>today()?new Date(i.value+'T00:00'):new Date();i.value=ymd(base.getTime()+b.dataset.ext*864e5)}),
  collect:d=>{const o={};d.querySelectorAll('[data-f]').forEach(i=>{if(i.type!='file')o[i.dataset.f]=i.value.trim()});o._f=d.querySelector('[data-f=logo]').files[0];if(!o.name){toast(t('nameReq'));return false}return o}});
 if(!v)return;once('es',async()=>{const f=v._f;delete v._f;if(f)v.logo=await shrink(f);await W(updateDoc(doc(db,'tenants',id),v))})};
G.tog=(id,k,v)=>once('tg',()=>W(updateDoc(doc(db,'tenants',id),k=='active'?{active:v}:{['features.'+k]:v})));
function vUsers(){const tn=id=>(S.tenants.find(x=>x.id==id)||{}).name||'—',v=S.usq.toLowerCase();
 const L=S.users.filter(u=>(!S.urole||u.role==S.urole)&&((u.name||'').toLowerCase().includes(v)||(u.email||'').toLowerCase().includes(v)||tn(u.tenantId).toLowerCase().includes(v))).sort((a,b)=>tn(a.tenantId).localeCompare(tn(b.tenantId)));
 $('#m').innerHTML=`<div class=chips>${[['',t('all')],['owner','Owner'],['cashier','Staff'],['super','Super']].map(([k,l])=>`<button class="chip s ${S.urole==k?'on':''}" onclick="S2.urole='${k}';vUsers()">${l}</button>`).join('')}</div><input id=usq placeholder="🔍 ${t('search')}" value="${esc(S.usq)}" oninput="S2.usq=this.value;vUsers();const i=document.getElementById('usq');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
 <div class=card style="margin-top:8px">${L.map(u=>`<div class=lrow><div class=f><b>${esc(u.name||'—')}</b> <span class="tag ${u.role=='owner'?'blu':u.role=='super'?'amb':''}">${esc(u.role)}</span><div class=mut>${esc(u.email||'')} · 🏪 ${esc(tn(u.tenantId))}</div></div>${u.role!='super'?`<label class=sw><input type=checkbox ${u.active!==false?'checked':''} onchange="userOn('${jsq(u.uid)}',this.checked)"></label>`:''}${u.email?`<button class="sm ghost s" title="${t('reset')}" onclick="resetPw('${jsq(u.email)}')">🔑</button>`:''}</div>`).join('')||'—'}</div>`}
G.userOn=(uid,v)=>once('uo',()=>W(updateDoc(doc(db,'users',uid),{active:v})));
G.resetPw=e=>once('rp',async()=>{await sendPasswordResetEmail(auth,e);toast(t('resetSent')+': '+e)});
function vApp(){const c=S.cfg;$('#m').innerHTML=`<div class=card><div class=ch><b>📢 ${t('notice')}</b></div><textarea id=anot rows=3>${esc(c.notice||'')}</textarea><label class=mut>${t('supPh')}</label><input id=asup type=tel value="${esc(c.supportPhone||'')}"><label class=mut>${t('minv')} (${t('ver')} ${APP_VERSION})</label><input id=amv type=number value="${c.minVersion||''}"><button class=full style="margin-top:8px" onclick="saveCfg()">${t('saveB')}</button></div>
 <div class=card><div class=row><button class=ghost onclick="setLang()">🌐 मराठी / English</button><button class=ghost onclick="setTheme()">${dark()?'☀️':'🌙'} ${t('theme')}</button></div><div style="margin-top:10px">${instBtn()}</div><button class="red full" style="margin-top:10px" onclick="out()">⎋ ${t('logout')}</button></div>`}
G.saveCfg=()=>once('cf',()=>W(setDoc(doc(db,'settings','appConfig'),{notice:$('#anot').value.trim(),supportPhone:$('#asup').value.trim(),minVersion:num($('#amv').value)},{merge:true})));
// demo data
G.seed=id=>once('sd',async()=>{const tn=S.tenants.find(x=>x.id==id),sh=(tn.shops||[])[0]||{id:'main',name:tn.name},w=writeBatch(db),c=n=>doc(collection(db,'tenants',id,n));
  const P=[['Basmati Rice','बासमती तांदूळ','kg',110,92],['Toor Dal','तूर डाळ','kg',150,128],['Sugar','साखर','kg',46,41],['Sunflower Oil','सूर्यफूल तेल','ltr',140,122],['Tea Powder','चहा पावडर','pkt',120,98],['Atta 5kg','गव्हाचे पीठ ५ किलो','pkt',260,225],['Biscuits','बिस्किटे','pkt',10,8],['Milk','दूध','pouch',30,27]].map((x,i)=>({id:c('products').id,name:x[0],mr:x[1],unit:x[2],price:x[3],cost:x[4],stock:40+i*7,min:15,code:String(101+i),order:i+1,fav:i<4,active:true,track:true,demo:true}));
  P.forEach(({id:i,...d})=>w.set(doc(db,'tenants',id,'products',i),d));const K=[['रमेश पाटील','9800000001',420,addDays(0)],['सुनीता जाधव','9800000002',0,''],['अनिल शिंदे','9800000003',1250,addDays(-5)]];
  K.forEach(k=>w.set(doc(db,'tenants',id,'customers',k[1]),{name:k[0],phone:k[1],addr:'पुणे',due:k[2],lastBill:Date.now(),lastDue:k[2]?Date.now()-10*864e5:0,...(k[3]?{dueDate:k[3]}:{}),demo:true}));
  for(let i=0;i<16;i++){const its=[0,1,2].map(j=>{const p=P[(i*3+j*2)%8];return{id:p.id,name:p.name,mr:p.mr,unit:p.unit,qty:1+(i+j)%3,price:p.price,base:p.price,cost:p.cost,order:p.order}}),T=its.reduce((s,x)=>s+x.qty*x.price,0),k=K[i%3];w.set(c('bills'),{no:'DEMO-'+(i+1),ts:Date.now()-(i%7)*864e5-i*36e5,shopId:sh.id,shopName:sh.name,by:'Demo',cust:{name:k[0],phone:k[1],addr:'',key:k[1]},items:its,charges:[],sub:T,total:T,paid:T,due:0,mode:['cash','upi','card'][i%3],demo:true})}
  await W(w.commit())});
G.unseed=id=>once('us',async()=>{for(const n of['products','customers','bills']){const q=await getDocs(query(collection(db,'tenants',id,n),where('demo','==',true))),w=writeBatch(db);q.docs.forEach(d=>w.delete(d.ref));if(q.size)await w.commit()}toast(t('ok'))});

G.vTenants=vTenants;G.vUsers=vUsers;
// ── PWA ──
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v='+APP_VERSION).catch(()=>{}));
addEventListener('bip',()=>{if(!S.u)document.querySelectorAll('.instb').forEach(b=>b.style.display='')});
console.info('SuperMarket v'+APP_VERSION);
</script>
